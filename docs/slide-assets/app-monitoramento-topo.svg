<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 400" width="390" height="400" font-family="Archivo, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1A56DB"/>
      <stop offset="0.5" stop-color="#0B2065"/>
      <stop offset="1"   stop-color="#1A56DB"/>
    </linearGradient>
    <clipPath id="tela"><rect x="0" y="0" width="390" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#tela)">
    <rect x="0" y="0" width="390" height="400" fill="url(#fundo)"/>

    <!-- ===== CABEÇALHO ===== -->
    <text x="26" y="52" fill="#FFFFFF" font-size="25" font-weight="700">Monitoramento</text>
    <text x="26" y="78" fill="#BFD2F5" font-size="14">Residencial Vila Nova · Caminhão 4</text>

    <!-- ===== VELOCÍMETRO ===== -->
    <g transform="translate(5, 108)">
      <circle cx="190.00" cy="175.00" r="158" fill="#09163A"/>
      <circle cx="190.00" cy="175.00" r="158" fill="none" stroke="#1E3A80" stroke-width="4"/>
      <path d="M45.00 175.00 A145 145 0 0 1 59.36 112.09 L106.21 134.65 A93 93 0 0 0 97.00 175.00 Z" fill="#DC2626"/>
      <path d="M59.36 112.09 A145 145 0 0 1 99.59 61.63 L132.02 102.29 A93 93 0 0 0 106.21 134.65 Z" fill="#F97316"/>
      <path d="M99.59 61.63 A145 145 0 0 1 280.41 61.63 L247.98 102.29 A93 93 0 0 0 132.02 102.29 Z" fill="#22C55E"/>
      <path d="M280.41 61.63 A145 145 0 0 1 320.64 112.09 L273.79 134.65 A93 93 0 0 0 247.98 102.29 Z" fill="#FACC15"/>
      <path d="M320.64 112.09 A145 145 0 0 1 335.00 175.00 L283.00 175.00 A93 93 0 0 0 273.79 134.65 Z" fill="#DC2626"/>
      <line x1="58.46" y1="111.65" x2="107.11" y2="135.08" stroke="#09163A" stroke-width="3.5"/>
      <line x1="98.97" y1="60.85" x2="132.64" y2="103.07" stroke="#09163A" stroke-width="3.5"/>
      <line x1="281.03" y1="60.85" x2="247.36" y2="103.07" stroke="#09163A" stroke-width="3.5"/>
      <line x1="321.54" y1="111.65" x2="272.89" y2="135.08" stroke="#09163A" stroke-width="3.5"/>
      <text x="33.04" y="142.67" fill="#DC2626" font-size="9" font-weight="bold" text-anchor="middle">FRIO</text>
      <text x="64.13" y="78.12" fill="#F97316" font-size="9" font-weight="bold" text-anchor="middle">BAIXA</text>
      <text x="190.00" y="17.50" fill="#22C55E" font-size="9" font-weight="bold" text-anchor="middle">IDEAL</text>
      <text x="315.87" y="78.12" fill="#FACC15" font-size="9" font-weight="bold" text-anchor="middle">ALTA</text>
      <text x="346.96" y="142.67" fill="#DC2626" font-size="9" font-weight="bold" text-anchor="middle">CRÍTICA</text>
      <polygon points="205.44,61.04 185.05,174.33 194.95,175.67" fill="#FFFFFF"/>
      <circle cx="190.00" cy="175.00" r="11" fill="#22C55E" stroke="#09163A" stroke-width="3"/>
    </g>

    <!-- leitura, logo abaixo do arco -->
    <text x="195" y="352" fill="#FFFFFF" font-size="58" font-weight="700" text-anchor="middle"
          font-family="'IBM Plex Mono', Consolas, monospace">24°</text>
    <text x="195" y="382" fill="#22C55E" font-size="16" font-weight="700" text-anchor="middle">Temperatura ideal</text>

    <!-- ===== CARTÃO: UMIDADE DA MASSA ===== -->
    <rect x="18" y="404" width="354" height="164" rx="14" fill="#FFFFFF"/>
    <text x="36" y="432" fill="#757575" font-size="11.5" font-weight="700" letter-spacing="1.4">UMIDADE DA MASSA</text>
    <circle cx="42" cy="459" r="7" fill="#22C55E"/>
    <text x="57" y="465" fill="#22C55E" font-size="19" font-weight="700">Massa estável</text>
    <text x="36" y="490" fill="#757575" font-size="13.5">A mistura está como saiu da usina.</text>

    <rect x="36" y="506" width="318" height="12" rx="6" fill="#EEEEEE"/>
    <rect x="36" y="506" width="74"  height="12" rx="6" fill="#22C55E"/>
    <circle cx="110" cy="512" r="9" fill="#FFFFFF" stroke="#22C55E" stroke-width="3"/>
    <text x="36"  y="542" fill="#9AA0A6" font-size="11.5">como saiu</text>
    <text x="354" y="542" fill="#9AA0A6" font-size="11.5" text-anchor="end">mais líquida</text>

    <!-- ===== CARTÃO: VOLUME DE CIMENTO ===== -->
    <rect x="18" y="584" width="354" height="196" rx="14" fill="#FFFFFF"/>
    <text x="36" y="612" fill="#757575" font-size="11.5" font-weight="700" letter-spacing="1.4">VOLUME DE CIMENTO</text>

    <rect x="36" y="628" width="264" height="12" rx="6" fill="#EEEEEE"/>
    <rect x="36" y="628" width="256" height="12" rx="6" fill="#22C55E"/>
    <text x="354" y="639" fill="#22C55E" font-size="16" font-weight="700" text-anchor="end">97%</text>

    <circle cx="43" cy="666" r="8" fill="#22C55E"/>
    <path d="M39 666 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="671" fill="#22C55E" font-size="15" font-weight="700">Entregas conferem</text>
    <text x="36" y="692" fill="#757575" font-size="12.5">O volume descarregado bate com o comprado</text>

    <line x1="36" y1="706" x2="354" y2="706" stroke="#EEEEEE" stroke-width="1.5"/>

    <g text-anchor="middle">
      <text x="96"  y="729" fill="#9AA0A6" font-size="10.5" font-weight="700" letter-spacing="1">PLANEJADO</text>
      <text x="96"  y="759" fill="#212121" font-size="27" font-weight="700" font-family="'IBM Plex Mono', Consolas, monospace">8.0</text>
      <text x="96"  y="775" fill="#9AA0A6" font-size="11">m³</text>

      <text x="195" y="729" fill="#9AA0A6" font-size="10.5" font-weight="700" letter-spacing="1">COMPRADO</text>
      <text x="195" y="759" fill="#212121" font-size="27" font-weight="700" font-family="'IBM Plex Mono', Consolas, monospace">8.0</text>
      <text x="195" y="775" fill="#9AA0A6" font-size="11">m³</text>

      <text x="294" y="729" fill="#9AA0A6" font-size="10.5" font-weight="700" letter-spacing="1">ENTREGUE</text>
      <text x="294" y="759" fill="#22C55E" font-size="27" font-weight="700" font-family="'IBM Plex Mono', Consolas, monospace">7.8</text>
      <text x="294" y="775" fill="#9AA0A6" font-size="11">m³</text>
    </g>
  </g>

  <rect x="1" y="1" width="388" height="398" rx="20" fill="none" stroke="#0B2065" stroke-width="2"/>
</svg>
