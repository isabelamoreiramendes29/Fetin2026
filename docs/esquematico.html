<title>Esquemático Cemtinel</title>
<style>
  @page { size: A4 landscape; margin: 6mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #14181A; font-family: Arial, Helvetica, sans-serif; }
  .folha { width: 100%; max-width: 1600px; margin: 0 auto; padding: 10px; }
  .aviso {
    font-size: 12px; line-height: 1.5; color: #555;
    border: 1px solid #ccc; padding: 8px 10px; margin-bottom: 10px; max-width: 900px;
  }
  .aviso b { color: #000; }
  svg { display: block; width: 100%; height: auto; }
  @media print { .aviso { display: none; } .folha { padding: 0; } }
</style>

<div class="folha">
  <div class="aviso">
    <b>Como usar:</b> tire um print desta página (ou imprima em PDF) e ponha no slide.
    Funciona em fundo claro. Este aviso não sai na impressão.
  </div>

  <svg viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <linearGradient id="tamb" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#EDEFF2"/>
        <stop offset="1" stop-color="#A8AFB8"/>
      </linearGradient>
    </defs>

    <!-- ================= TITULO ================= -->
    <text x="40" y="52" font-size="34" font-weight="bold" fill="#14181A">CEMTINEL — como funciona</text>
    <text x="40" y="86" font-size="20" fill="#5C6469">Do carregamento na fábrica até a marcação na planta do prédio</text>
    <line x1="40" y1="104" x2="1560" y2="104" stroke="#14181A" stroke-width="3"/>

    <!-- ================= 1. CAMINHAO ================= -->
    <text x="40" y="150" font-size="17" font-weight="bold" fill="#9E3327" letter-spacing="2">1 · NO CAMINHÃO</text>

    <!-- chassi e rodas -->
    <rect x="60" y="360" width="400" height="26" fill="#7C848D"/>
    <rect x="56" y="348" width="408" height="14" rx="3" fill="#98A0A9"/>
    <circle cx="130" cy="400" r="30" fill="#33383E"/><circle cx="130" cy="400" r="12" fill="#8A9099"/>
    <circle cx="330" cy="400" r="30" fill="#33383E"/><circle cx="330" cy="400" r="12" fill="#8A9099"/>
    <circle cx="400" cy="400" r="30" fill="#33383E"/><circle cx="400" cy="400" r="12" fill="#8A9099"/>

    <!-- cabine -->
    <path d="M62 348 L62 258 L92 236 L150 230 L150 348 Z" fill="#B7BDC4" stroke="#545B63" stroke-width="2"/>
    <path d="M94 252 L144 246 L144 276 L94 276 Z" fill="#7FA8C9" stroke="#5A7E9B" stroke-width="1.5"/>

    <!-- tambor inclinado -->
    <path d="M180 300 C182 262 224 240 286 238 C346 236 404 250 430 266 L430 330 C404 346 346 358 286 356 C224 354 182 338 180 300 Z"
          fill="url(#tamb)" stroke="#6B7280" stroke-width="2.5"/>
    <ellipse cx="240" cy="298" rx="10" ry="58" fill="none" stroke="#8A9099" stroke-width="1.8"/>
    <ellipse cx="340" cy="297" rx="10" ry="57" fill="none" stroke="#8A9099" stroke-width="1.8"/>
    <ellipse cx="430" cy="298" rx="10" ry="32" fill="#6E757E" stroke="#545B63" stroke-width="2"/>

    <!-- sensores no tambor -->
    <rect x="252" y="228" width="12" height="70" rx="3" fill="#E4694F"/>
    <circle cx="258" cy="222" r="9" fill="#E4694F"/>
    <rect x="322" y="230" width="12" height="80" rx="3" fill="#E0A32B"/>
    <circle cx="328" cy="224" r="9" fill="#E0A32B"/>
    <rect x="424" y="336" width="34" height="14" rx="3" fill="#14B8A6"/>
    <circle cx="470" cy="343" r="9" fill="#14B8A6"/>
    <circle cx="106" cy="222" r="9" fill="#8B5CF6"/>
    <rect x="86" y="230" width="40" height="16" rx="3" fill="#8B5CF6"/>

    <!-- legenda dos sensores -->
    <g font-size="19" fill="#14181A">
      <circle cx="70" cy="470" r="9" fill="#E0A32B"/><text x="90" y="477">temperatura da massa</text>
      <circle cx="70" cy="508" r="9" fill="#E4694F"/><text x="90" y="515">umidade — detecta água adicionada</text>
      <circle cx="70" cy="546" r="9" fill="#14B8A6"/><text x="90" y="553">vazão — mede o volume na descarga</text>
      <circle cx="70" cy="584" r="9" fill="#8B5CF6"/><text x="90" y="591">GPS — posição do caminhão</text>
    </g>

    <!-- ================= 2. ESP ================= -->
    <text x="560" y="150" font-size="17" font-weight="bold" fill="#9E3327" letter-spacing="2">2 · PLACA</text>

    <line x1="490" y1="300" x2="556" y2="300" stroke="#6B7280" stroke-width="3" marker-end="url(#seta)"/>

    <rect x="560" y="240" width="190" height="120" rx="8" fill="#3B4A5A" stroke="#26313D" stroke-width="2"/>
    <rect x="580" y="266" width="80" height="40" rx="4" fill="#8C97A6"/>
    <rect x="676" y="266" width="12" height="40" rx="2" fill="#D9C27A"/>
    <rect x="698" y="266" width="12" height="40" rx="2" fill="#D9C27A"/>
    <text x="655" y="392" font-size="21" font-weight="bold" text-anchor="middle" fill="#14181A">ESP32 / ESP8266</text>
    <text x="655" y="420" font-size="17" text-anchor="middle" fill="#5C6469">lê os sensores e publica</text>

    <!-- ================= 3. MQTT ================= -->
    <text x="830" y="150" font-size="17" font-weight="bold" fill="#9E3327" letter-spacing="2">3 · REDE</text>

    <line x1="760" y1="300" x2="826" y2="300" stroke="#6B7280" stroke-width="3" marker-end="url(#seta)"/>

    <rect x="830" y="240" width="190" height="120" rx="8" fill="#E8F0F6" stroke="#3E7EA8" stroke-width="2.5"/>
    <path d="M880 320 A50 50 0 0 1 970 320" fill="none" stroke="#3E7EA8" stroke-width="5"/>
    <path d="M898 330 A30 30 0 0 1 952 330" fill="none" stroke="#3E7EA8" stroke-width="5"/>
    <circle cx="925" cy="336" r="7" fill="#3E7EA8"/>
    <text x="925" y="286" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F6FB2">MQTT</text>
    <text x="925" y="392" font-size="17" text-anchor="middle" fill="#5C6469">protocolo leve, por Wi-Fi</text>
    <text x="925" y="418" font-size="17" text-anchor="middle" fill="#5C6469">cada caminhão tem seu canal</text>

    <!-- ================= 4. APP ================= -->
    <text x="1100" y="150" font-size="17" font-weight="bold" fill="#9E3327" letter-spacing="2">4 · APLICATIVO</text>

    <line x1="1030" y1="300" x2="1096" y2="300" stroke="#6B7280" stroke-width="3" marker-end="url(#seta)"/>

    <rect x="1100" y="198" width="150" height="250" rx="16" fill="#0B2065" stroke="#1F6FB2" stroke-width="2.5"/>
    <rect x="1112" y="222" width="126" height="200" rx="6" fill="#16307F"/>
    <circle cx="1140" cy="252" r="8" fill="#22C55E"/>
    <text x="1158" y="259" font-size="15" fill="#CBD9F5">conectado</text>
    <text x="1175" y="316" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff">24°</text>
    <rect x="1124" y="340" width="102" height="10" rx="5" fill="#3B82F6"/>
    <rect x="1124" y="364" width="70" height="10" rx="5" fill="#E4694F"/>
    <rect x="1124" y="388" width="88" height="10" rx="5" fill="#14B8A6"/>
    <text x="1175" y="478" font-size="21" font-weight="bold" text-anchor="middle" fill="#14181A">celular</text>

    <!-- ================= 5. BANCO ================= -->
    <text x="1340" y="150" font-size="17" font-weight="bold" fill="#9E3327" letter-spacing="2">5 · BANCO</text>

    <line x1="1256" y1="286" x2="1336" y2="286" stroke="#2F6B45" stroke-width="3" marker-end="url(#seta)"/>
    <line x1="1336" y1="320" x2="1256" y2="320" stroke="#2F6B45" stroke-width="3" marker-end="url(#seta)"/>

    <ellipse cx="1440" cy="240" rx="98" ry="26" fill="#DCEFE3" stroke="#2F6B45" stroke-width="2.5"/>
    <path d="M1342 240 L1342 350 A98 26 0 0 0 1538 350 L1538 240" fill="#DCEFE3" stroke="#2F6B45" stroke-width="2.5"/>
    <ellipse cx="1440" cy="296" rx="98" ry="26" fill="none" stroke="#2F6B45" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1440" y="404" font-size="21" font-weight="bold" text-anchor="middle" fill="#14181A">histórico guardado</text>
    <text x="1440" y="432" font-size="17" text-anchor="middle" fill="#5C6469">leituras, obras, resultados</text>
    <text x="1440" y="458" font-size="17" text-anchor="middle" fill="#5C6469">cada obra vê só o que é dela</text>

    <!-- ================= 6. O QUE SAI ================= -->
    <line x1="40" y1="650" x2="1560" y2="650" stroke="#14181A" stroke-width="3"/>
    <text x="40" y="694" font-size="17" font-weight="bold" fill="#9E3327" letter-spacing="2">6 · O QUE O USUÁRIO VÊ</text>

    <line x1="1175" y1="452" x2="1175" y2="600" stroke="#6B7280" stroke-width="3"/>
    <line x1="1175" y1="600" x2="270" y2="600" stroke="#6B7280" stroke-width="3"/>
    <line x1="270" y1="600" x2="270" y2="716" stroke="#6B7280" stroke-width="3" marker-end="url(#seta)"/>
    <line x1="790" y1="600" x2="790" y2="716" stroke="#6B7280" stroke-width="3" marker-end="url(#seta)"/>
    <line x1="1310" y1="600" x2="1310" y2="716" stroke="#6B7280" stroke-width="3" marker-end="url(#seta)"/>

    <rect x="60" y="720" width="420" height="200" rx="10" fill="#F7F9F8" stroke="#D3D8D6" stroke-width="2"/>
    <text x="90" y="768" font-size="24" font-weight="bold" fill="#14181A">Monitoramento</text>
    <text x="90" y="804" font-size="18" fill="#5C6469">Temperatura, estado da massa</text>
    <text x="90" y="832" font-size="18" fill="#5C6469">e os três volumes lado a lado:</text>
    <text x="90" y="860" font-size="18" fill="#5C6469">pedido · pago · medido</text>
    <text x="90" y="896" font-size="18" fill="#9E3327" font-weight="bold">em tempo real</text>

    <rect x="580" y="720" width="420" height="200" rx="10" fill="#F7F9F8" stroke="#D3D8D6" stroke-width="2"/>
    <text x="610" y="768" font-size="24" font-weight="bold" fill="#14181A">Alertas</text>
    <text x="610" y="804" font-size="18" fill="#5C6469">Temperatura fora da faixa</text>
    <text x="610" y="832" font-size="18" fill="#5C6469">ou salto de umidade —</text>
    <text x="610" y="860" font-size="18" fill="#5C6469">sinal de água adicionada.</text>
    <text x="610" y="896" font-size="18" fill="#9E3327" font-weight="bold">com o caminhão ainda na estrada</text>

    <rect x="1100" y="720" width="440" height="200" rx="10" fill="#F7F9F8" stroke="#9E3327" stroke-width="2.5"/>
    <text x="1130" y="768" font-size="24" font-weight="bold" fill="#14181A">Mapa de Concretagem</text>
    <text x="1130" y="804" font-size="18" fill="#5C6469">Foto da planta do prédio, com</text>
    <text x="1130" y="832" font-size="18" fill="#5C6469">cada área ligada ao caminhão</text>
    <text x="1130" y="860" font-size="18" fill="#5C6469">e ao resultado dos 28 dias.</text>
    <text x="1130" y="896" font-size="18" fill="#9E3327" font-weight="bold">área reprovada fica vermelha</text>

  </svg>
</div>
