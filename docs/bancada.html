<title>Bancada Cemtinel</title>
<style>
  @page { size: A4 landscape; margin: 6mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #14181A; font-family: Arial, Helvetica, sans-serif; }
  .folha { width: 100%; max-width: 1600px; margin: 0 auto; padding: 10px; }
  .aviso {
    font-size: 12px; line-height: 1.5; color: #555;
    border: 1px solid #ccc; padding: 8px 10px; margin-bottom: 10px; max-width: 900px;
  }
  .aviso b { color: #000; }
  svg { display: block; width: 100%; height: auto; }
  @media print { .aviso { display: none; } .folha { padding: 0; } }
</style>

<div class="folha">
  <div class="aviso">
    <b>Como usar:</b> print desta página ou impressão em PDF, direto para o slide.
    Serve também para montar a bancada: tudo que aparece aqui é o que precisa estar na mesa.
    Este aviso não sai na impressão.
  </div>

  <svg viewBox="0 0 1600 950" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <clipPath id="dentroGarrafa">
        <rect x="200" y="300" width="360" height="200" rx="34"/>
      </clipPath>
    </defs>

    <!-- ===== TITULO ===== -->
    <text x="40" y="50" font-size="34" font-weight="bold" fill="#14181A">A BANCADA — como a demonstração é montada</text>
    <text x="40" y="84" font-size="20" fill="#5C6469">A água faz o papel do concreto. Nenhum furo abaixo da linha da água.</text>
    <line x1="40" y1="102" x2="1560" y2="102" stroke="#14181A" stroke-width="3"/>

    <!-- ===== BANDEJA ===== -->
    <rect x="70" y="726" width="1400" height="26" rx="6" fill="#B4BAC1" stroke="#6B7280" stroke-width="2"/>
    <text x="1400" y="744" font-size="17" text-anchor="end" fill="#3E4448">bandeja</text>

    <!-- ===== BERCOS (alturas diferentes = tambor inclinado) ===== -->
    <polygon points="250,726 320,726 314,560 262,560" fill="#8A7F72" stroke="#5F564C" stroke-width="2"/>
    <polygon points="470,726 540,726 534,520 482,520" fill="#8A7F72" stroke="#5F564C" stroke-width="2"/>

    <!-- ===== TAMBOR IMPRESSO (em corte) ===== -->
    <path d="M150 400 C152 342 210 302 292 300 C382 298 470 318 508 344 L508 452 C470 478 382 498 292 496 C210 494 152 458 150 400 Z"
          fill="#C3C8CF" fill-opacity="0.42" stroke="#6B7280" stroke-width="3"/>
    <ellipse cx="240" cy="398" rx="13" ry="94" fill="none" stroke="#8A9099" stroke-width="2"/>
    <ellipse cx="370" cy="396" rx="13" ry="96" fill="none" stroke="#8A9099" stroke-width="2"/>
    <ellipse cx="508" cy="398" rx="13" ry="54" fill="#8A9099" fill-opacity="0.5" stroke="#6B7280" stroke-width="2"/>

    <!-- ===== GARRAFA PET DENTRO ===== -->
    <rect x="200" y="300" width="360" height="200" rx="34" fill="#EAF2F8" fill-opacity="0.8" stroke="#3E7EA8" stroke-width="3"/>
    <rect x="196" y="384" width="368" height="120" fill="#5B9BD5" fill-opacity="0.8" clip-path="url(#dentroGarrafa)"/>

    <!-- ===== BOMBA SUBMERSA ===== -->
    <rect x="372" y="412" width="96" height="62" rx="6" fill="#33383E" stroke="#1C2024" stroke-width="2"/>
    <rect x="384" y="428" width="7" height="32" rx="2" fill="#6E757E"/>
    <rect x="398" y="428" width="7" height="32" rx="2" fill="#6E757E"/>
    <rect x="412" y="428" width="7" height="32" rx="2" fill="#6E757E"/>
    <rect x="408" y="392" width="24" height="22" rx="4" fill="#8A9099" stroke="#5A6068" stroke-width="2"/>

    <!-- ===== ABERTURA NO TOPO + MANGUEIRA E FIO ===== -->
    <rect x="386" y="294" width="70" height="20" rx="4" fill="#8A9099" stroke="#545B63" stroke-width="2"/>
    <path d="M420 396 L420 300 C420 246 520 218 640 250 C800 292 860 470 890 600"
          fill="none" stroke="#9CA3AF" stroke-width="16" stroke-linecap="round"/>
    <path d="M420 396 L420 300 C420 246 520 218 640 250 C800 292 860 470 890 600"
          fill="none" stroke="#D5D9DE" stroke-width="6" stroke-linecap="round"/>
    <path d="M444 410 C464 340 440 292 414 268" fill="none" stroke="#2E2E33" stroke-width="4"/>

    <!-- ===== SONDAS ===== -->
    <rect x="252" y="286" width="46" height="20" rx="4" fill="#4B5563" stroke="#374151" stroke-width="2"/>
    <rect x="266" y="306" width="18" height="110" rx="4" fill="#E4694F" stroke="#B04B36" stroke-width="2"/>
    <rect x="316" y="290" width="46" height="20" rx="4" fill="#4B5563" stroke="#374151" stroke-width="2"/>
    <rect x="330" y="310" width="18" height="150" rx="4" fill="#E0A32B" stroke="#A87716" stroke-width="2"/>

    <!-- ===== CAIXA DA PROTOPLACA ===== -->
    <rect x="600" y="620" width="210" height="86" rx="8" fill="#3B4A5A" stroke="#26313D" stroke-width="2"/>
    <rect x="620" y="640" width="96" height="46" rx="4" fill="#8C97A6"/>
    <rect x="730" y="640" width="14" height="46" rx="3" fill="#D9C27A"/>
    <rect x="754" y="640" width="14" height="46" rx="3" fill="#D9C27A"/>

    <!-- ===== SENSOR DE VAZAO ===== -->
    <rect x="890" y="586" width="200" height="86" rx="8" fill="#3B4A5A" stroke="#26313D" stroke-width="2"/>
    <rect x="874" y="614" width="20" height="30" rx="5" fill="#8A9099" stroke="#6B7280" stroke-width="2"/>
    <rect x="1086" y="614" width="20" height="30" rx="5" fill="#8A9099" stroke="#6B7280" stroke-width="2"/>

    <!-- ===== MANGUEIRA 2 ===== -->
    <path d="M1102 630 C1140 640 1170 656 1196 678" fill="none" stroke="#9CA3AF" stroke-width="16" stroke-linecap="round"/>
    <path d="M1102 630 C1140 640 1170 656 1196 678" fill="none" stroke="#D5D9DE" stroke-width="6" stroke-linecap="round"/>

    <!-- ===== BALDE ===== -->
    <rect x="1190" y="586" width="190" height="140" rx="6" fill="#B4BAC1" stroke="#6B7280" stroke-width="2.5"/>
    <rect x="1200" y="650" width="170" height="68" rx="4" fill="#5B9BD5" fill-opacity="0.85"/>

    <!-- ===== LEGENDA DAS SONDAS, DENTRO DO DESENHO ===== -->
    <rect x="700" y="150" width="470" height="96" rx="8" fill="#F7F9F8" stroke="#D3D8D6" stroke-width="2"/>
    <circle cx="730" cy="184" r="11" fill="#E4694F" stroke="#B04B36" stroke-width="2"/>
    <text x="754" y="191" font-size="19" fill="#14181A">sonda de umidade — para no nível da água</text>
    <circle cx="730" cy="222" r="11" fill="#E0A32B" stroke="#A87716" stroke-width="2"/>
    <text x="754" y="229" font-size="19" fill="#14181A">sensor de temperatura — submerso</text>

    <!-- ===== NUMEROS E CHAMADAS ===== -->
    <g font-size="21" font-weight="bold" fill="#fff">
      <circle cx="120" cy="250" r="22" fill="#9E3327"/><text x="120" y="258" text-anchor="middle">1</text>
      <circle cx="600" cy="250" r="22" fill="#9E3327"/><text x="600" y="258" text-anchor="middle">2</text>
      <circle cx="420" cy="540" r="22" fill="#9E3327"/><text x="420" y="548" text-anchor="middle">3</text>
      <circle cx="700" cy="560" r="22" fill="#9E3327"/><text x="700" y="568" text-anchor="middle">4</text>
      <circle cx="990" cy="540" r="22" fill="#9E3327"/><text x="990" y="548" text-anchor="middle">5</text>
      <circle cx="1285" cy="540" r="22" fill="#9E3327"/><text x="1285" y="548" text-anchor="middle">6</text>
    </g>

    <line x1="140" y1="268" x2="180" y2="330" stroke="#9E3327" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="592" y1="268" x2="470" y2="294" stroke="#9E3327" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="420" y1="518" x2="420" y2="478" stroke="#9E3327" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="700" y1="582" x2="700" y2="618" stroke="#9E3327" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="990" y1="562" x2="990" y2="584" stroke="#9E3327" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="1285" y1="562" x2="1285" y2="584" stroke="#9E3327" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- ===== LEGENDA ===== -->
    <line x1="40" y1="790" x2="1560" y2="790" stroke="#14181A" stroke-width="3"/>

    <g font-size="19" fill="#14181A">
      <text x="46" y="828" font-weight="bold" fill="#9E3327">1</text>
      <text x="70" y="828" font-weight="bold">Tambor impresso em 3D</text>
      <text x="70" y="856" fill="#5C6469">A casca. Nunca molha — três furos, todos em cima.</text>

      <text x="46" y="888" font-weight="bold" fill="#9E3327">2</text>
      <text x="70" y="888" font-weight="bold">Garrafa PET por dentro</text>
      <text x="70" y="916" fill="#5C6469">A água fica só aqui. O plástico impresso nunca encosta nela.</text>

      <text x="540" y="828" font-weight="bold" fill="#9E3327">3</text>
      <text x="564" y="828" font-weight="bold">Bomba submersa</text>
      <text x="564" y="856" fill="#5C6469">Fica na água. Mangueira e fio saem por cima.</text>

      <text x="540" y="888" font-weight="bold" fill="#9E3327">4</text>
      <text x="564" y="888" font-weight="bold">Caixa da protoplaca</text>

      <text x="1030" y="828" font-weight="bold" fill="#9E3327">5</text>
      <text x="1054" y="828" font-weight="bold">Sensor de vazão</text>
      <text x="1054" y="856" fill="#5C6469">Entre duas mangueiras, em tubo fechado.</text>

      <text x="1030" y="888" font-weight="bold" fill="#9E3327">6</text>
      <text x="1054" y="888" font-weight="bold">Balde “obra”</text>
    </g>


  </svg>
</div>
